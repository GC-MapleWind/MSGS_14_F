<!doctype html>
<html lang="ko">

<head>
	<meta charset="utf-8" />
	<script>
		// FOUC 방지: CSS 로드 전에 저장된 테마를 즉시 적용
		(function () {
			try {
				var stored = localStorage.getItem('theme');
				var dark =
					stored === 'dark' ||
					((!stored || stored === 'system') &&
						window.matchMedia('(prefers-color-scheme: dark)').matches);
				document.documentElement.classList.toggle('dark', dark);
			} catch (e) { }
		})();
	</script>
	<link rel="icon" type="image/x-icon" href="%sveltekit.assets%/images/icons/app_favicon.ico?v=15" />
	<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
	<link rel="stylesheet" as="style" crossorigin
		href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
	<title>단풍바람 14기</title>

	<!-- SEO & Metadata -->

	<meta property="og:description" content="단풍바람 14기 메생결산 - 우리의 GAME 여정을 기록합니다." />
