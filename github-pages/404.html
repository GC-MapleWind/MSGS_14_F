<!doctype html>
<html lang="ko">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>단풍바람 메생결산으로 이동 중</title>
	</head>
	<body>
		<p>메생결산 화면으로 이동 중입니다.</p>
		<script>
			(() => {
				const parts = location.pathname.split("/").filter(Boolean);
				const rootHosted = parts[0] === "member" || parts[0] === "msg";
				const base = rootHosted ? "/" : `/${parts.shift()}/`;
				const route = `/${parts.join("/")}${location.search}${location.hash}`;
				location.replace(`${base}?route=${encodeURIComponent(route)}`);
			})();
		</script>
	</body>
</html>
